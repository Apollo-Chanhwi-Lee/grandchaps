# Short explanations the conversation can look up (instmate/explain.py).  One passage = one fact about how the app
# works or one basic idea of harmony, in plain Korean.  `ask` holds words a user may use for it; it is searched
# together with the title and the text.  Keep every passage true to the code: when a behaviour changes, change it here.
passages:
  - id: genres
    title: 어떤 장르가 있나요
    ask: 장르 종류 어떤 있는데 뭐가 스타일 장르 목록 록 발라드 감성록 하드록 모던록 힙합 댄스
    text: >-
      발라드, 록, 댄스, 케이팝, 제이팝, 뉴에이지, 힙합, 피아노 록, 팝펑크, 하드록, 감성록, 모던록, 클래식이 있어요. 대화창에 "감성록으로"처럼 이름을 그대로 말하면 그 장르로 만들어요. 감성록과 록은 다른 장르예요.
  - id: seed_kept
    title: 올린 멜로디는 바뀌지 않아요
    ask: 내 멜로디 그대로 후렴 바뀌나 바뀐 거 아니야 고치나 씨앗 원본 유지
    text: >-
      올려 주신 멜로디는 한 음도 바꾸지 않고 후렴(또는 고르신 자리)에 그대로 넣어요. 파일을 격자에 맞추느라 옮긴 음이 있으면 마디와 박을 먼저 보여 드리고 동의를 받은 뒤에만 진행해요.
  - id: who_writes
    title: 벌스·프리코러스·브릿지는 누가 쓰나요
    ask: 누가 만들었나 AI가 쓴 구간 모델 벌스 브릿지 프리코러스 작곡
    text: >-
      벌스, 프리코러스, 브릿지의 멜로디는 리드시트 모델이 올린 멜로디의 조와 분위기에 맞춰 써요. 쓴 뒤에는 코드가 음역, 코드와의 충돌, 비슷한 곡 여부를 검사하고, 통과하지 못하면 다시 써요. "AI 없이"를 고르면 올린 멜로디를 규칙으로 변형한 것만 써요.
  - id: rewrite
    title: 마음에 들지 않는 구간만 다시 쓸 수 있어요
    ask: 다시 써줘 구간 수정 브릿지 다시 벌스 다시 고치기
    text: >-
      "브릿지 다시 써줘"처럼 말하면 그 구간만 새로 쓰고 다른 구간은 그대로 둬요. 올려 주신 멜로디가 들어간 구간은 앱이 고치지 않아요.
  - id: chords_how
    title: 코드는 어떻게 정하나요
    ask: 왜 이 코드 코드 진행 화음 어떻게 골랐나 반주 코드 이유
    text: >-
      코드는 마디마다 그 마디의 멜로디 음과 잘 어울리는 것을 조성 안에서 골라요. 멜로디의 긴 음이나 강박의 음이 코드의 구성음이면 잘 어울리고, 코드 구성음과 반음으로 부딪히면 피해요. 장르마다 자주 쓰는 진행도 함께 고려해요. 악보에 코드가 적혀 있으면 적힌 대로 써요.
  - id: functions
    title: 으뜸·버금딸림·딸림 화음
    ask: 화성 기능 토닉 도미넌트 서브도미넌트 1도 4도 5도 화음 역할
    text: >-
      조성 안의 코드는 크게 세 가지 역할을 해요. 으뜸화음(1도)은 쉬는 자리, 버금딸림화음(4도)은 떠나는 자리, 딸림화음(5도)은 으뜸으로 돌아가고 싶게 만드는 자리예요. 많은 대중음악이 이 셋과 6도 단화음을 돌려 써요.
  - id: clash
    title: 멜로디와 코드가 부딪힌다는 것
    ask: 충돌 부딪힘 불협 어색한 소리 검사 실패 안 어울림
    text: >-
      멜로디 음이 코드 구성음보다 반음 위에 길게 놓이면 탁하게 들려요. 앱은 코드를 바꿀 때마다 이런 자리가 얼마나 되는지 세고, 기준을 넘으면 바꾸지 않고 알려 드려요. 그래도 적용할지는 사용자가 버튼으로 정해요.
  - id: darker_brighter
    title: 코드를 더 어둡게, 더 밝게
    ask: 어둡게 밝게 분위기 바꿔 슬프게 단조 느낌 코드 바꾸기
    text: >-
      더 어둡게는 그 마디의 코드를 조성 안의 단화음 쪽으로, 더 밝게는 장화음 쪽으로 바꾸는 거예요. 조성 밖의 코드는 쓰지 않고, 멜로디와 부딪히는지 검사한 뒤에만 적용해요. 마디별 코드 바꾸기는 "직접 설정" 탭에 있어요.
  - id: key_question
    title: 조를 되묻는 이유
    ask: 왜 조를 물어봐 장조 단조 어느 느낌 조성 애매 나란한조
    text: >-
      다장조와 가단조처럼 같은 음을 쓰는 두 조가 있어요. 멜로디만으로 어느 쪽인지 가릴 수 없으면 앱이 추측하지 않고 여쭤봐요. 고르신 조에 따라 코드가 밝게 또는 어둡게 달라져요.
  - id: voice_fit
    title: 보컬 음역에 맞춰 조를 옮겨요
    ask: 조 옮김 음역 여성 남성 키 높다 낮다 왜 조가 바뀌었나 이조
    text: >-
      여성 보컬은 G3~G5, 남성 보컬은 G2~G4에 맞춰 곡 전체를 같은 반음 수만큼 옮겨요. 음 사이의 간격과 리듬은 그대로예요. 이미 음역 안이면 옮기지 않고, 옮겼으면 몇 반음 옮겼는지 화면에 적어요.
  - id: ai_vocal
    title: AI 보컬(YuE2)은 무엇인가요
    ask: AI 보컬 YuE2 완성본 노래 목소리 5키 낮다 왜 낮춰 하이라이트 얹기
    text: >-
      "AI 보컬로 하이라이트 듣기"를 누르면 노래 모델 YuE2가 벌스부터 첫 후렴까지 약 1분을 부르고, 그 목소리만 분리해 이 곡의 반주에 얹어요. 원래 조보다 5키(반음 다섯) 낮은 조로 부르고, 멜로디를 줄여서 불러서 올린 멜로디와 똑같지는 않아요. 메모리를 약 18GB 쓰고 2~3분 걸려요.
  - id: guide_vocal
    title: 가이드 보컬은 무엇인가요
    ask: 가이드 보컬 아 발음 기계음 임시 미리듣기 라라라
    text: >-
      가이드 보컬은 악보의 음높이와 길이를 정확히 따라 '아~'로 부르는 합성 목소리예요. 사람 노래처럼 자연스럽지는 않지만 멜로디를 정확히 들려줘요. 완성본은 AI 보컬을 얹은 버전이고, 가이드 보컬은 임시 미리듣기예요.
  - id: sections
    title: 벌스, 프리코러스, 후렴, 브릿지
    ask: 구간 구성 벌스가 뭐야 후렴이 뭐야 브릿지가 뭐야 프리코러스 뜻 곡 구조
    text: >-
      벌스는 이야기를 풀어 가는 낮고 차분한 부분, 프리코러스는 후렴으로 끌어올리는 짧은 부분, 후렴은 가장 높고 여러 번 반복되는 부분, 브릿지는 한 번만 나와 분위기를 바꾸는 부분이에요.
  - id: section_parts
    title: 구간별 편성 옵션
    ask: 구간별 편성 악기 수 벌스에서 기타 쉬어 옵션 켜기
    text: >-
      구간별 편성을 켜면 벌스와 프리코러스에서 코드 악기 하나가 쉬고 후렴에서 다시 들어와요. 마지막 후렴에서는 멜로디를 한 옥타브 위에서 한 번 더 연주해요. 음량은 건드리지 않아요. 기본은 꺼져 있어요.
  - id: whole_score
    title: 긴 악보를 곡 전체로 편곡할 때
    ask: 곡 전체 편곡 긴 악보 구간 나누기 후렴 자동 찾기 후렴은 어떻게 찾아 반으로
    text: >-
      8마디가 넘는 악보를 "곡 전체"로 고르면 멜로디를 적힌 그대로 두고 밴드 반주만 붙여요. 구간은 앞 절반을 벌스, 뒤 절반을 후렴으로 먼저 나눠요. "후렴 자동 찾기"를 켜면 멜로디에서 반복되는 부분을 찾아 후렴으로 부르고, 찾은 구간을 알려 드려요. 반복이 후렴이 아닌 곡에서는 틀릴 수 있어요.
  - id: llm_role
    title: 말은 어디에 쓰이나요
    ask: 언어 모델 LLM 역할 도구 호출 function calling 챗봇 에이전트
    text: >-
      대화의 순서는 코드가 정하고, 언어 모델은 말에서 장르나 보컬 같은 답을 읽거나 어떤 도구를 부를지 고르는 데만 써요. 음표와 코드는 모델이 직접 쓰지 않고 함수가 바꿔요. 모델이 고른 도구와 인자는 실행 전에 코드가 검사해요. 모델이 꺼져 있어도 앱은 규칙만으로 돌아가요.
  - id: mix
    title: 믹스·마스터 옵션
    ask: 믹스 마스터 음량 LUFS 소리 크기 넓게 옵션
    text: >-
      믹스·마스터 2안은 악기마다 음색을 다듬고 좌우로 벌린 뒤 -12 LUFS 근처로 마무리해요. LUFS는 사람이 느끼는 음량의 단위예요. 3안은 기타를 좌우로 겹쳐 더 넓게 만들고 -11 LUFS로 마무리해요. 기본은 2안이에요.
  - id: band_pack
    title: 밴드 팩에는 무엇이 들어 있나요
    ask: 밴드 팩 받기 파일 MIDI 악보 다운로드 합주
    text: >-
      밴드 팩은 코드표, 파트 안내, 파트별 MIDI, 악보, 리드시트를 한 묶음으로 받는 파일이에요. 결과는 고쳐 쓰는 초안이라, 각자 파트를 받아 합주에서 바꿔 연주하면 돼요.
  - id: part_scores
    title: 파트별 악보와 타브
    ask: 파트 악보 타브 기타 운지 드럼 악보 베이스 연습
    text: >-
      기타, 베이스, 피아노, 드럼 악보를 파트별로 그려요. 기타와 베이스는 프렛 번호(타브)도 함께 보여 줘요. 운지는 손을 덜 움직이는 쪽으로 고른 제안이고 확정된 채보가 아니에요.
  - id: similar
    title: 비슷한 곡 검사
    ask: 표절 비슷한 곡 검사 주의 높음 저작권
    text: >-
      앱이 쓴 멜로디가 기준 곡 모음의 어떤 곡과 음과 리듬이 길게 겹치면 알려요. 10음 이상 겹치면 주의, 16음 이상이면 높음이에요. 앱이 쓴 구간이 높음이면 다시 써요. 이 검사는 경고일 뿐 법적 판단이 아니에요.
  - id: licence
    title: 어디까지 써도 되나요
    ask: 상업적 사용 라이선스 배포 수업용 비영리 저작권
    text: >-
      리드시트 모델의 학습 자료와 AI 보컬 YuE2의 가중치(CC BY-NC 4.0)는 비영리 조건이라, 이 앱의 결과는 수업과 연습용이에요. 배포 모드를 켜면 배포 가능한 악기만 쓰고 AI 보컬은 쓰지 않아요.
  - id: tempo
    title: 템포(BPM)
    ask: 템포 빠르기 BPM 느리게 빠르게
    text: >-
      템포는 1분에 4분음표가 몇 번 나오는지(BPM)예요. 파일에 템포가 적혀 있으면 그 값을 쓰고, 없으면 장르의 보통 빠르기를 써요. 템포와 악기별 세기는 "직접 설정" 탭에서 바꿀 수 있어요.
  - id: key_change
    title: 마지막 후렴의 조 올림
    ask: 전조 마지막 후렴 반음 올림 키 체인지
    text: >-
      마지막 후렴을 반음 올려 부르는 것은 선택 사항이고 기본은 꺼져 있어요. 켜면 마지막 후렴만 반음 높아지고 나머지는 그대로예요.
